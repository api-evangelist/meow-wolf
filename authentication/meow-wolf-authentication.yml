note: >-
  Meow Wolf publishes no API authentication documentation, because it publishes no API.
  This profile is derived entirely from a live, anonymous OIDC discovery document served
  by the company's own identity host, auth.meowwolf.com — an Auth0 custom-domain tenant
  (CNAME meowwolf-cd-swbu1coxwcncnddi.edge.tenants.auth0.com). It was found by following
  https://meowwolf.com/sign-in, which redirects to the ticketing app carrying
  ?iss=https%3A%2F%2Fauth.meowwolf.com%2F. This is consumer sign-in for the ticketing
  and customer-portal apps, NOT a developer authorization surface: no client credentials
  are issued to third parties, no scopes beyond the standard OIDC profile/email set are
  defined, and no API audience is documented. Recorded because it is real, callable and
  standards-conformant, and because it is the only machine-readable contract on the
  entire Meow Wolf estate.
