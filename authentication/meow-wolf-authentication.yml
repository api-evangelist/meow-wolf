observations:
- >-
  Dynamic client registration is enabled (/oidc/register present), which is unusual for
  a pure consumer-login tenant and is the closest thing on the estate to a
  self-service developer on-ramp — but it is undocumented and unadvertised.
- >-
  The implicit and password (ROPC) grants are both still enabled, which OAuth 2.1 and
  the Auth0 hardening guidance both deprecate.
- >-
  code_challenge_methods_supported includes "plain" alongside S256; S256 only is the
  recommended posture.
- >-
  Back-channel logout is supported, and global token revocation per connection is
  exposed — a comparatively modern Auth0 tenant configuration.
