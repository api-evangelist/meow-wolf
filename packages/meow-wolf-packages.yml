note: >-
  Meow Wolf publishes first-party packages, but NONE of them is a client SDK for a Meow
  Wolf API — the company operates no public API. What is published is open-source
  infrastructure from its own show-control / installation platform (an AMQP 0-9-1 event
  bus, Node-RED nodes for it, Go helper libraries) plus two build bundles for its own
  Webflow website and customer portal. Because there is no API for these to wrap, this
  artifact deliberately carries a `Packages` pointer in apis.yml and NOT an `SDKs`
  pointer: crediting SDK ergonomics for an API that does not exist would be false.
  Registries searched with no first-party result: PyPI, RubyGems, crates.io, NuGet,
  Maven Central, Packagist.
