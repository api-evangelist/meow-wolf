aid: meow-wolf
name: Meow Wolf
description: 'Meow Wolf is an arts-production and entertainment company founded in
  Santa Fe, New Mexico that designs and operates large-scale immersive, interactive
  art exhibitions — House of Eternal Return (Santa Fe), Omega Mart (Las Vegas), Convergence
  Station (Denver), The Real Unreal (Grapevine, TX) and Radio Tave (Houston) — with
  further locations announced for Los Angeles and New York City. Around the exhibitions
  it runs a consumer ticketing platform, an online merchandise shop, a mobile companion
  app for iOS and Android, an arts foundation and an education program. It is a visitor-experience
  business rather than a software vendor: it operates no public developer program and
  publishes no API reference, OpenAPI, AsyncAPI, GraphQL SDL or Postman collection.
  Its public engineering output is an open-source GitHub organization of show-control,
  beacon and AMQP messaging tooling built for its own installations. The one genuine
  machine-readable contract on the estate is undocumented: auth.meowwolf.com, an Auth0
  custom-domain tenant, serves a complete anonymous OpenID Connect / RFC 8414 discovery
  document and a live JWKS for consumer sign-in to the ticketing and portal apps.'
